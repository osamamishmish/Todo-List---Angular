<div class="completed-container" appTheme>
@for(completed of completedTodos() ; track $index ){
  <div class="completed">
    <div class="completed-content">
      <input type="checkbox" (change)="toggleTodo($index)" [checked]="completed.checked"/>
      <p [class]="completed.checked ? 'completed' : 'active'">{{completed.text}}</p>
    </div>

  <span><i class="bi bi-x-lg"></i></span>
    </div>


}
</div>
