<div class="active-container" appTheme>
@for(active of activeTodos() ; track $index ){
  <div class="active">
    <div class="active-content">
      <input type="checkbox" class="active-input" (change)="toggleTodo($index)" [checked]="active.checked"/>
      <p [class]="active.checked ? 'completed' : 'active'">{{active.text}}</p>
    </div>

  <span (click)="deleteActive($index)"><i class="bi bi-x-lg"></i></span>
    </div>


}
</div>
